<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/backrooms/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Backrooms</title>
	<link rel="icon" href="img/icon.png">
	<link rel="stylesheet" href="TemplateData/style.css">
	<script src="js/main.js"></script>
	<script src="TemplateData/UnityProgress.js"></script>
	<script src="Build/UnityLoader.js"></script>
	<style>
		html, body, .webgl-content, #gameContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
		.webgl-content, #gameContainer { width: 100vw; height: 100vh; }
		canvas { width: 100% !important; height: 100% !important; }
		#loading-text { position: fixed; top: 16px; left: 0; z-index: 5; width: 100%; margin: 0; color: #fff; font: 18px sans-serif; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Backrooms...</p>
	<div class="webgl-content"><div id="gameContainer"></div></div>
	<div id="load-error" role="alert"></div>
	<script>
		const loadingText = document.querySelector("#loading-text");
		const loadError = document.querySelector("#load-error");
		try {
			if (!window.UnityLoader || !window.UnityProgress) throw new Error("Could not load the Unity game loader");
			window.UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/backrooms/Build/WebGL.json", {
				onProgress: (instance, progress) => {
					window.UnityProgress(instance, progress);
					if (progress >= 1) loadingText.remove();
				},
			});
		} catch (error) {
			loadingText.textContent = "Backrooms could not be loaded";
			loadError.textContent = error.message;
			console.error(error);
		}
	</script>
</body>
</html>
