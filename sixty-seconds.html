<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>60 Seconds</title>
	<link rel="shortcut icon" href="Image.png">
	<link rel="stylesheet" href="TemplateData/style.css">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
		#unity-container { position: relative !important; width: 100% !important; height: 100% !important; margin: 0 !important; display: flex; align-items: center; justify-content: center; }
		#unity-canvas { display: block; width: 100% !important; height: 100% !important; background: #231f20; }
		#unity-loading-bar { position: absolute; top: 50%; left: 50%; width: min(80%, 400px); transform: translate(-50%, -50%); color: #fff; text-align: center; font: 14px Arial, sans-serif; }
		#unity-progress-bar-empty { width: 100%; height: 8px; margin-top: 12px; background: #555; }
		#unity-progress-bar-full { width: 0; height: 100%; background: #fff; transition: width 100ms linear; }
		#unity-warning { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2; color: #fff; font: 14px Arial, sans-serif; }
	</style>
</head>
<body>
	<div id="unity-container" class="unity-desktop">
		<canvas id="unity-canvas" tabindex="-1" aria-label="60 Seconds game"></canvas>
		<div id="unity-loading-bar" role="status" aria-live="polite">
			<div id="unity-loading-label">Loading 60 Seconds...</div>
			<div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
		</div>
		<div id="unity-warning" role="alert"></div>
	</div>
	<script>
		const container = document.querySelector("#unity-container");
		const canvas = document.querySelector("#unity-canvas");
		const loadingBar = document.querySelector("#unity-loading-bar");
		const loadingLabel = document.querySelector("#unity-loading-label");
		const progressBar = document.querySelector("#unity-progress-bar-full");
		const warningBanner = document.querySelector("#unity-warning");
		const baseUrl = "https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/";
		const buildUrl = `${baseUrl}Build`;

		function unityShowBanner(message, type) {
			warningBanner.textContent = message;
			warningBanner.style.background = type === "error" ? "#b00020" : "#805b00";
			warningBanner.style.padding = "10px";
			warningBanner.style.display = "block";
			if (type !== "error") setTimeout(() => { warningBanner.textContent = ""; warningBanner.style.display = "none"; }, 5000);
		}

		async function startGame() {
			loadingBar.style.display = "block";
			try {
				const dataFiles = Array.from({ length: 6 }, (_, index) => `Build.data.unityweb.${index}`);
				const parts = await Promise.all(dataFiles.map(async (file) => {
					const response = await fetch(`${buildUrl}/${file}`);
					if (!response.ok) throw new Error(`Failed to load ${file} (${response.status})`);
					return response.arrayBuffer();
				}));
				const totalBytes = parts.reduce((total, part) => total + part.byteLength, 0);
				const combined = new Uint8Array(totalBytes);
				let offset = 0;
				for (const part of parts) {
					combined.set(new Uint8Array(part), offset);
					offset += part.byteLength;
				}
				const dataUrl = URL.createObjectURL(new Blob([combined]));
				const config = {
					dataUrl,
					frameworkUrl: `${buildUrl}/Build.framework.js.unityweb`,
					codeUrl: `${buildUrl}/Build.wasm.unityweb`,
					streamingAssetsUrl: `${baseUrl}StreamingAssets`,
					companyName: "Robot Gentleman",
					productName: "60 Seconds",
					productVersion: "1.0",
					showBanner: unityShowBanner,
				};
				if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
					container.className = "unity-mobile";
					config.devicePixelRatio = 1;
					unityShowBanner("WebGL builds may not be supported on mobile devices.", "warning");
				}
				const loader = document.createElement("script");
				loader.src = `${buildUrl}/Build.loader.js`;
				loader.onerror = () => unityShowBanner("Could not load the Unity game loader. Check your connection.", "error");
				loader.onload = () => {
					window.createUnityInstance(canvas, config, (progress) => {
						progressBar.style.width = `${100 * progress}%`;
						loadingLabel.textContent = `Loading 60 Seconds... ${Math.round(100 * progress)}%`;
					}).then(() => {
						loadingBar.style.display = "none";
					}).catch((error) => unityShowBanner(String(error), "error"));
				};
				document.body.append(loader);
			} catch (error) {
				unityShowBanner(`Unable to load 60 Seconds: ${error.message}`, "error");
			}
		}

		startGame();
	</script>
</body>
</html>
