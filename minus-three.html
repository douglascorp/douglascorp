<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/web-ports/baldi-mods@main/-3/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>-3</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
		#unity-container { position: fixed !important; inset: 0; width: 100% !important; height: 100% !important; }
		#unity-canvas { display: block; width: 100% !important; height: 100% !important; }
		#loading-text { position: fixed; top: 16px; left: 0; z-index: 5; width: 100%; margin: 0; color: #fff; font: 22px cursive; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading -3...</p>
	<div id="unity-container">
		<canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="-3 game"></canvas>
		<div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
		<div id="unity-warning"></div>
	</div>
	<div id="load-error" role="alert"></div>
	<script>
		const gameBase = "https://cdn.jsdelivr.net/gh/web-ports/baldi-mods@main/-3/";
		const buildUrl = `${gameBase}Build`;
		const loadingText = document.querySelector("#loading-text");
		const loadingBar = document.querySelector("#unity-loading-bar");
		const progressBar = document.querySelector("#unity-progress-bar-full");
		const loadError = document.querySelector("#load-error");
		let loadedBytes = 0;

		async function fetchPart(url) {
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Could not load game data (${response.status})`);
			if (!response.body) return response.arrayBuffer();
			const reader = response.body.getReader();
			const chunks = [];
			let length = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				length += value.length;
				loadedBytes += value.length;
				loadingText.textContent = `Loading -3... ${(loadedBytes / 1048576).toFixed(1)} / 111.21 MB`;
			}
			const buffer = new Uint8Array(length);
			let offset = 0;
			for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
			return buffer.buffer;
		}

		async function mergeParts(file, count, cacheKey) {
			let cache;
			if ("caches" in window) {
				try {
					cache = await caches.open("minus-three-cache");
					const cached = await cache.match(cacheKey);
					if (cached) return URL.createObjectURL(await cached.blob());
				} catch { cache = undefined; }
			}
			const parts = await Promise.all(Array.from({ length: count }, (_, index) => fetchPart(`${buildUrl}/${file}.part${index + 1}`)));
			const blob = new Blob(parts);
			if (cache) {
				try { await cache.put(cacheKey, new Response(blob)); } catch {}
			}
			return URL.createObjectURL(blob);
		}

		async function startGame() {
			try {
				const [dataUrl, wasmUrl] = await Promise.all([
					mergeParts("minus3bog.data", 5, "minus3bog.data"),
					mergeParts("minus3bog.wasm", 2, "minus3bog.wasm"),
				]);
				const loader = document.createElement("script");
				loader.src = `${buildUrl}/minus3bog.loader.js`;
				loader.onerror = () => {
					loadingText.textContent = "-3 could not be loaded";
					loadError.textContent = "Could not load the Unity game loader. Check your internet connection.";
				};
				loader.onload = () => {
					const config = {
						dataUrl,
						frameworkUrl: `${buildUrl}/minus3bog.framework.js`,
						codeUrl: wasmUrl,
						streamingAssetsUrl: `${gameBase}StreamingAssets`,
						companyName: "Mauzer2137",
						productName: "-3",
						productVersion: "3.-3",
					};
					if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = 1;
					loadingBar.style.display = "block";
					window.createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
						progressBar.style.width = `${100 * progress}%`;
					}).then(() => {
						loadingBar.style.display = "none";
						loadingText.remove();
					}).catch((error) => {
						loadingText.textContent = "-3 could not be loaded";
						loadError.textContent = String(error);
						console.error(error);
					});
				};
				document.body.append(loader);
			} catch (error) {
				loadingText.textContent = "-3 could not be loaded";
				loadError.textContent = error.message;
				console.error(error);
			}
		}

		startGame();
	</script>
</body>
</html>
