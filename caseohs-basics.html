<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/bubbls/ports@latest/baldi-caseoh/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CaseOhs Basics in Eating and Fast Food</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<script src="TemplateData/UnityProgress.js"></script>
	<script>
		window.fileMergerConfig = {
			files: [
				{ name: "web.data.unityweb", parts: 2 },
				{ name: "web.wasm.code.unityweb", parts: 2 },
			],
			basePath: "Build/",
		};
	</script>
	<script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>
	<script src="Build/UnityLoader.js"></script>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body, .webgl-content { width: 100%; height: 100%; overflow: hidden; background: #000; }
		.webgl-content, #unityContainer { width: 100%; height: 100%; }
		#unityContainer { width: 100% !important; height: 100% !important; }
		.footer { display: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<div class="webgl-content">
		<div id="unityContainer"></div>
	</div>
	<div id="load-error" role="alert"></div>
	<script>
		const loadError = document.querySelector("#load-error");
		try {
			if (!window.UnityLoader || !window.UnityProgress) throw new Error("Could not load the Unity game loader");
			window.unityInstance = window.UnityLoader.instantiate("unityContainer", "Build/web.json", {
				onProgress: (instance, progress) => window.UnityProgress(instance, progress),
			});
		} catch (error) {
			loadError.textContent = `CaseOhs Basics could not be loaded: ${error.message}`;
			console.error(error);
		}
	</script>
</body>
</html>
