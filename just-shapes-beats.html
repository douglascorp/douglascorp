<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/web-ports/jsab@main/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Just Shapes &amp; Beats</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<script src="TemplateData/UnityProgress.js"></script>
	<script src="Build/UnityLoader.js"></script>
	<style>
		html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
		body { cursor: url("Cursor.png"), auto; }
		.webgl-content, #unityContainer { width: 100vw !important; height: 100vh !important; margin: 0 !important; }
		canvas { width: 100% !important; height: 100% !important; }
		#loading-text { position: fixed; top: 20px; left: 50%; z-index: 10; transform: translateX(-50%); margin: 0; color: #fff; font: bold 22px cursive; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 11; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Just Shapes &amp; Beats...</p>
	<div class="webgl-content"><div id="unityContainer"></div></div>
	<div id="load-error" role="alert"></div>
	<script>
		const gameBase = "https://cdn.jsdelivr.net/gh/web-ports/jsab@main/";
		const loadingText = document.querySelector("#loading-text");
		const loadError = document.querySelector("#load-error");
		let loadedBytes = 0;

		async function fetchPart(url) {
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Could not load game asset (${response.status})`);
			if (!response.body) return response.arrayBuffer();
			const reader = response.body.getReader();
			const chunks = [];
			let length = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				length += value.length;
				loadedBytes += value.length;
				loadingText.textContent = `Loading assets... ${(loadedBytes / 1048576).toFixed(1)} / 132.83 MB`;
			}
			const buffer = new Uint8Array(length);
			let offset = 0;
			for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
			return buffer.buffer;
		}

		async function mergeParts(path, count, cacheKey) {
			let cache;
			if ("caches" in window) {
				try {
					cache = await caches.open("jsab-cache");
					const cached = await cache.match(cacheKey);
					if (cached) return URL.createObjectURL(await cached.blob());
				} catch { cache = undefined; }
			}
			const buffers = await Promise.all(Array.from({ length: count }, (_, index) => fetchPart(`${gameBase}${path}.part${index + 1}`)));
			const blob = new Blob(buffers);
			if (cache) {
				try { await cache.put(cacheKey, new Response(blob)); } catch {}
			}
			return URL.createObjectURL(blob);
		}

		async function startGame() {
			try {
				const [dataUrl, wasmUrl, fontBundleUrl] = await Promise.all([
					mergeParts("Build/jsab.data.unityweb", 4, "jsab.data.unityweb"),
					mergeParts("Build/jsab.wasm.code.unityweb", 2, "jsab.wasm.code.unityweb"),
					mergeParts("StreamingAssets/aa/WebGL/fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle", 3, "fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle"),
				]);
				if (!window.UnityLoader) throw new Error("Could not load the Unity game loader");
				const originalOpen = XMLHttpRequest.prototype.open;
				const originalSend = XMLHttpRequest.prototype.send;
				XMLHttpRequest.prototype.open = function (method, url, ...rest) {
					this._gameAssetUrl = url;
					if (typeof url === "string" && url.includes("jsab.data.unityweb")) url = dataUrl;
					else if (typeof url === "string" && url.includes("jsab.wasm.code.unityweb")) url = wasmUrl;
					else if (typeof url === "string" && url.includes("fonts_tmp_assets_all_c2712a523e390d12249a703a5257c93b.bundle")) url = fontBundleUrl;
					else if (typeof url === "string" && url.includes(".bundle")) loadingText.textContent = url.split("/").pop().replace(".bundle", "");
					return originalOpen.call(this, method, url, ...rest);
				};
				XMLHttpRequest.prototype.send = function (...args) {
					if (this._gameAssetUrl && this._gameAssetUrl.includes(".bundle")) this.addEventListener("loadend", () => { loadingText.style.display = "none"; });
					return originalSend.apply(this, args);
				};
				UnityLoader.instantiate("unityContainer", `${gameBase}Build/jsab.json`, {
					onProgress: (instance, progress) => {
						UnityProgress(instance, progress);
						if (progress >= 1) loadingText.remove();
					},
				});
			} catch (error) {
				loadError.textContent = `Unable to load Just Shapes & Beats: ${error.message}`;
				loadingText.textContent = "Game could not be loaded";
				console.error(error);
			}
		}

		startGame();
	</script>
</body>
</html>
