<!doctype html>
<html lang="en">
<head>
	<base href="https://rawcdn.githack.com/genizy/assets/ff73bc4b150bcc3d18fe719bdb50e4338742e4f9/ages-of-conflict/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ages of Conflict</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #231f20; }
		#unity-container { position: fixed !important; inset: 0; width: 100% !important; height: 100% !important; }
		#unity-canvas { display: block; width: 100% !important; height: 100% !important; }
		#unity-footer { display: none !important; }
		#loading-text { position: fixed; top: 16px; left: 0; z-index: 5; width: 100%; margin: 0; color: #fff; font: 16px sans-serif; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Ages of Conflict...</p>
	<div id="unity-container" class="unity-desktop">
		<canvas id="unity-canvas" width="1280" height="720" tabindex="-1" aria-label="Ages of Conflict"></canvas>
		<div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
		<div id="unity-warning"></div>
	</div>
	<div id="load-error" role="alert"></div>
	<script>
		const gameBase = "https://rawcdn.githack.com/genizy/assets/ff73bc4b150bcc3d18fe719bdb50e4338742e4f9/ages-of-conflict/";
		const buildUrl = `${gameBase}Build`;
		const loadingText = document.querySelector("#loading-text");
		const loadError = document.querySelector("#load-error");
		const progressBar = document.querySelector("#unity-progress-bar-full");
		function showBanner(message, type) {
			const warning = document.querySelector("#unity-warning");
			warning.textContent = message;
			warning.style.display = "block";
			warning.style.padding = "10px";
			warning.style.background = type === "error" ? "#b00020" : "#805b00";
		}

		const loader = document.createElement("script");
		loader.src = `${buildUrl}/v1.04.2w.loader.js`;
		loader.onerror = () => {
			loadingText.textContent = "Ages of Conflict could not be loaded";
			loadError.textContent = "Could not load the Unity game loader. Check your internet connection.";
		};
		loader.onload = () => {
			const config = {
				dataUrl: `${buildUrl}/v1.04.2w.data.unityweb`,
				frameworkUrl: `${buildUrl}/v1.04.2w.framework.js.unityweb`,
				codeUrl: `${buildUrl}/v1.04.2w.wasm.unityweb`,
				streamingAssetsUrl: `${gameBase}StreamingAssets`,
				companyName: "JokuPelle",
				productName: "Ages of Conflict",
				productVersion: "1.04.2",
				showBanner,
			};
			window.createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
				progressBar.style.width = `${100 * progress}%`;
			}).then(() => {
				loadingText.remove();
				document.querySelector("#unity-loading-bar").style.display = "none";
			}).catch((error) => {
				loadingText.textContent = "Ages of Conflict could not be loaded";
				loadError.textContent = String(error);
				console.error(error);
			});
		};
		document.head.append(loader);
	</script>
</body>
</html>
