<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/aukak/hollow-knight@2fc2e7149f0d5b2609b135ab48f00fd973930635/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hollow Knight</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #231f20; }
		#unity-container { position: fixed !important; inset: 0; width: 100% !important; height: 100% !important; }
		#unity-canvas { display: block; width: 100% !important; height: 100% !important; }
		#loading-text { position: fixed; inset: 16px 8px auto; z-index: 5; color: #fff; font: 16px sans-serif; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Hollow Knight assets (about 913 MB)...</p>
	<div id="unity-container" class="unity-desktop" hidden>
		<canvas id="unity-canvas" tabindex="-1" aria-label="Hollow Knight game"></canvas>
		<div id="unity-loading-bar">
			<div id="unity-logo"></div>
			<div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
		</div>
		<div id="unity-mobile-warning">WebGL builds may not be supported on mobile devices.</div>
	</div>
	<div id="load-error" role="alert"></div>
	<script>
		const gameBase = "https://cdn.jsdelivr.net/gh/aukak/hollow-knight@2fc2e7149f0d5b2609b135ab48f00fd973930635/";
		const buildUrl = `${gameBase}Build`;
		const loadingText = document.querySelector("#loading-text");
		const loadError = document.querySelector("#load-error");
		let loadedBytes = 0;

		async function fetchAsset(url) {
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Could not load a game asset (${response.status})`);
			if (!response.body) return response.arrayBuffer();
			const reader = response.body.getReader();
			const chunks = [];
			let length = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				length += value.length;
				loadedBytes += value.length;
				loadingText.textContent = `Downloading Hollow Knight... ${(loadedBytes / 1048576).toFixed(1)} / 912.81 MB`;
			}
			const buffer = new Uint8Array(length);
			let offset = 0;
			for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
			return buffer.buffer;
		}

		async function loadParts(file, count) {
			const parts = [];
			for (let first = 1; first <= count; first += 3) {
				const batch = Array.from({ length: Math.min(3, count - first + 1) }, (_, index) => first + index);
				parts.push(...await Promise.all(batch.map((part) => fetchAsset(`${buildUrl}/${file}.part${part}`))));
			}
			return URL.createObjectURL(new Blob(parts));
		}

		async function startGame() {
			try {
				const [dataUrl, wasmUrl] = await Promise.all([
					loadParts("hktruffled.data", 45),
					loadParts("hktruffled.wasm", 2),
				]);
				const container = document.querySelector("#unity-container");
				const canvas = document.querySelector("#unity-canvas");
				const loadingBar = document.querySelector("#unity-loading-bar");
				const progressBar = document.querySelector("#unity-progress-bar-full");
				container.hidden = false;
				if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
					container.className = "unity-mobile";
				} else {
					canvas.width = window.innerWidth;
					canvas.height = window.innerHeight;
					window.addEventListener("resize", () => {
						canvas.width = window.innerWidth;
						canvas.height = window.innerHeight;
					});
				}
				loadingBar.style.display = "block";
				const loader = document.createElement("script");
				loader.src = `${buildUrl}/hktruffled.loader.js`;
				loader.onerror = () => {
					loadingText.textContent = "Hollow Knight could not be loaded";
					loadError.textContent = "Could not load the Unity game loader. Check your internet connection.";
				};
				loader.onload = () => {
					const config = {
						dataUrl,
						frameworkUrl: `${buildUrl}/hktruffled.framework.js`,
						codeUrl: wasmUrl,
						streamingAssetsUrl: `${gameBase}StreamingAssets`,
						companyName: "Team Cherry & Truffled",
						productName: "Hollow Knight",
						productVersion: "1.1",
					};
					window.createUnityInstance(canvas, config, (progress) => {
						progressBar.style.width = `${100 * progress}%`;
					}).then(() => {
						loadingText.remove();
						loadingBar.style.display = "none";
						canvas.style.display = "block";
					}).catch((error) => {
						loadError.textContent = `Unable to start Hollow Knight: ${error}`;
						console.error(error);
					});
				};
				document.body.append(loader);
			} catch (error) {
				loadingText.textContent = "Hollow Knight could not be loaded";
				loadError.textContent = error.message;
				console.error(error);
			}
		}

		startGame();
	</script>
</body>
</html>
