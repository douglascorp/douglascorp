<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@main/baldi-remaster/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Baldi's Basics Classic Remastered</title>
	<style>
		html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #231f20; }
		#unity-canvas { display: block; width: 100% !important; height: 100% !important; }
		#loading-text { position: fixed; top: 16px; left: 0; z-index: 5; width: 100%; margin: 0; color: #fff; font: 16px sans-serif; text-align: center; pointer-events: none; }
		#load-error { position: fixed; inset: auto 12px 12px; z-index: 6; color: #fff; font: 14px sans-serif; text-align: center; }
	</style>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Baldi's Basics Classic Remastered...</p>
	<canvas id="unity-canvas" tabindex="-1" aria-label="Baldi's Basics Classic Remastered"></canvas>
	<div id="load-error" role="alert"></div>
	<script>
		const gameBase = "https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@main/baldi-remaster/";
		const buildUrl = `${gameBase}Build`;
		const loadingText = document.querySelector("#loading-text");
		const loadError = document.querySelector("#load-error");
		let loadedBytes = 0;

		async function fetchPart(url) {
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Could not load a game asset (${response.status})`);
			if (!response.body) return response.arrayBuffer();
			const reader = response.body.getReader();
			const chunks = [];
			let length = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				length += value.length;
				loadedBytes += value.length;
				loadingText.textContent = `Loading assets... ${(loadedBytes / 1048576).toFixed(1)} MB`;
			}
			const buffer = new Uint8Array(length);
			let offset = 0;
			for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
			return buffer.buffer;
		}

		async function mergeParts(file, count) {
			const parts = await Promise.all(Array.from({ length: count }, (_, index) => fetchPart(`${buildUrl}/${file}.part${index + 1}`)));
			return URL.createObjectURL(new Blob(parts));
		}

		async function startGame() {
			try {
				const [dataUrl, wasmUrl] = await Promise.all([
					mergeParts("WebGL.data", 3),
					mergeParts("WebGL.wasm", 3),
				]);
				const loader = document.createElement("script");
				loader.src = `${buildUrl}/WebGL.loader.js`;
				loader.onerror = () => {
					loadingText.textContent = "Baldi's Basics Classic Remastered could not be loaded";
					loadError.textContent = "Could not load the Unity game loader. Check your internet connection.";
				};
				loader.onload = () => {
					window.createUnityInstance(document.querySelector("#unity-canvas"), {
						dataUrl,
						frameworkUrl: `${buildUrl}/WebGL.framework.js`,
						codeUrl: wasmUrl,
						streamingAssetsUrl: `${gameBase}StreamingAssets`,
						companyName: "Basically Games",
						productName: "Baldi's Basics Classic Remastered",
						productVersion: "1.1",
					}, () => {}).then(() => {
						loadingText.remove();
					}).catch((error) => {
						loadingText.textContent = "Baldi's Basics Classic Remastered could not be loaded";
						loadError.textContent = String(error);
						console.error(error);
					});
				};
				document.body.append(loader);
			} catch (error) {
				loadingText.textContent = "Baldi's Basics Classic Remastered could not be loaded";
				loadError.textContent = error.message;
				console.error(error);
			}
		}

		startGame();
	</script>
</body>
</html>
