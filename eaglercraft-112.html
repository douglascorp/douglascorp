<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/XxFluffyAsherxX/Eaglercraft-1.12.2@main/Web/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<meta name="description" content="Eaglercraft 1.12.2">
	<title>Eaglercraft 1.12</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
		body { min-width: 320px; }
		#game_frame { width: 100%; height: 100%; }
		#load-error { position: fixed; inset: auto 16px 16px; z-index: 5; padding: 10px 14px; background: #181818; color: #ffb4ab; font: 14px sans-serif; overflow-wrap: anywhere; }
		#load-error[hidden] { display: none; }
	</style>
	<script src="ModAPI.js"></script>
	<script src="ModLoader.js"></script>
	<script src="ModGUI.js"></script>
	<script src="anvil.js"></script>
	<script src="classes.js"></script>
</head>
<body id="game_frame">
	<div id="load-error" role="alert" hidden></div>
	<script>
		window.addEventListener("load", () => {
			const loadError = document.querySelector("#load-error");
			if (location.protocol === "file:") {
				loadError.hidden = false;
				loadError.textContent = "Eaglercraft requires an HTTP server. Open this page through the game launcher.";
				return;
			}
			const relayId = Math.floor(Math.random() * 3);
			window.eaglercraftXOpts = {
				demoMode: false,
				container: "game_frame",
				assetsURI: "assets.epk",
				localesURI: "lang/",
				worldsDB: "worlds",
				logInvalidCerts: true,
				relays: [
					{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId === 0 },
					{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId === 1 },
					{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId === 2 },
				],
			};
			const server = new URLSearchParams(location.search).get("server");
			if (server) window.eaglercraftXOpts.joinServer = server;
			if (typeof window.main !== "function") {
				loadError.hidden = false;
				loadError.textContent = "Eaglercraft did not initialize. Check that its game scripts loaded.";
				return;
			}
			try {
				window.main();
			} catch (error) {
				loadError.hidden = false;
				loadError.textContent = `Eaglercraft could not start: ${error.message}`;
				console.error(error);
			}
		});
	</script>
</body>
</html>
