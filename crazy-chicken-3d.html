<!doctype html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/freebuisness/assets@main/255/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Crazy Chicken 3D</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="index.icon.png">
	<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
	<style>
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
		#canvas { display: block; width: 100%; height: 100%; }
		#loading-text { position: fixed; top: 20px; left: 0; z-index: 2; width: 100%; color: #fff; font: 24px sans-serif; text-align: center; pointer-events: none; }
		#status { position: fixed; inset: 0; display: grid; place-content: center; color: #fff; text-align: center; visibility: hidden; }
		#status-splash { max-width: 80vw; max-height: 70vh; object-fit: contain; }
		#status-progress { width: min(80vw, 420px); }
		#status-notice { max-width: 80vw; }
	</style>
	<script src="main.js"></script>
</head>
<body>
	<p id="loading-text" role="status" aria-live="polite">Loading Crazy Chicken 3D...</p>
	<canvas id="canvas" aria-label="Crazy Chicken 3D game"></canvas>
	<noscript>JavaScript is required to play this game.</noscript>
	<div id="status">
		<img id="status-splash" src="index.png" alt="">
		<progress id="status-progress"></progress>
		<div id="status-notice" role="alert"></div>
	</div>
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {
			args: [],
			canvasResizePolicy: 2,
			ensureCrossOriginIsolationHeaders: true,
			executable: "index",
			experimentalVK: false,
			fileSizes: { "index.pck": 38662480, "index.wasm": 43699190 },
			focusCanvas: true,
			gdextensionLibs: [],
		};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);
		function run() {
			const loadingText = document.querySelector("#loading-text");
			const statusOverlay = document.querySelector("#status");
			const statusProgress = document.querySelector("#status-progress");
			const statusNotice = document.querySelector("#status-notice");
			loadingText.remove();
			let initializing = true;
			let statusMode = "";
			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) return;
				if (mode === "hidden") {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = "visible";
				statusProgress.style.display = mode === "progress" ? "block" : "none";
				statusNotice.style.display = mode === "notice" ? "block" : "none";
				statusMode = mode;
			}
			function displayFailureNotice(error) {
				console.error(error);
				statusNotice.textContent = error instanceof Error ? error.message : String(error);
				setStatusMode("notice");
				initializing = false;
			}
			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length) {
				displayFailureNotice(`Required browser features are missing:\n${missing.join("\n")}`);
				return;
			}
			setStatusMode("progress");
			engine.startGame({
				onProgress(current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute("value");
						statusProgress.removeAttribute("max");
					}
				},
			}).then(() => setStatusMode("hidden"), displayFailureNotice);
		}
		window.godotRunStart = run;
	</script>
</body>
</html>
